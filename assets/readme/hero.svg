<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Modelo de Procesador</title>
  <desc id="d">Simulador didáctico de un procesador de 4 bits: registros, UAL y ciclos de reloj paso a paso.</desc>
  <style>
    :root{--bg:#0f1b2d;--fg:#f2f6fb;--mut:#8ea3bd;--pri:#2dd4bf;--acc:#fbbf24;--line:#26405f}
    @media (prefers-color-scheme: light){:root{--bg:#f4f8fc;--fg:#0f1b2d;--mut:#54698a;--pri:#0f766e;--acc:#b45309;--line:#c3d3e6}}
    text{font-family:"Segoe UI",system-ui,sans-serif}
    .bg{fill:var(--bg)} .ln{stroke:var(--line);stroke-width:2;fill:none}
    .box{fill:none;stroke:var(--pri);stroke-width:3}
    .bin{font-family:Consolas,"Courier New",monospace;fill:var(--line);font-size:26px}
    .h1{fill:var(--fg);font-size:64px;font-weight:700}
    .sub{fill:var(--mut);font-size:26px}
    .lbl{fill:var(--pri);font-family:Consolas,monospace;font-size:24px;font-weight:700;text-anchor:middle}
    .ck{stroke:var(--acc);stroke-width:4;fill:none}
    .tag{fill:var(--acc);font-family:Consolas,monospace;font-size:22px}
  </style>
  <rect class="bg" width="1200" height="380"/>
  <text class="bin" x="40" y="50">0110 1101 0010 1110 0111 1001</text>
  <text class="bin" x="640" y="350">1010 1111 0000 0001 1100 0101</text>
  <text class="h1" x="60" y="190">Modelo de Procesador</text>
  <text class="sub" x="62" y="240">Simulador didáctico de un procesador de 4 bits,</text>
  <text class="sub" x="62" y="276">ciclo de reloj por ciclo de reloj.</text>
  <g transform="translate(800,95)">
    <path class="ln" d="M0 50H40M0 120H40M0 190H40M240 50H280M240 120H280M240 190H280"/>
    <rect class="box" x="40" y="20" width="200" height="60" rx="10"/><text class="lbl" x="140" y="59">A · B</text>
    <rect class="box" x="40" y="90" width="200" height="60" rx="10"/><text class="lbl" x="140" y="129">UAL</text>
    <rect class="box" x="40" y="160" width="200" height="60" rx="10"/><text class="lbl" x="140" y="199">IP · RI</text>
    <path class="ck" d="M300 130h30v-30h30v30h30v-30h30v30h20"/>
    <text class="tag" x="300" y="170">Ck 0/1</text>
  </g>
</svg>
